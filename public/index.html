<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06080f">
  <title>Mafia — Shadow Conflict</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 sm:px-6">
    <header class="flex items-center justify-between py-5">
      <a href="/" class="font-display text-xl font-extrabold tracking-[0.2em] text-slate-100">
        M<span class="text-gold-400">●</span>FIA
      </a>
      <span id="connection" class="chip bg-white/5 text-slate-400" role="status" aria-live="polite">
        Connexion…
      </span>
    </header>

    <main id="app" class="flex-1 pb-10"></main>

    <footer class="flex justify-between border-t border-white/5 py-5 text-[11px] uppercase tracking-[0.25em] text-slate-500">
      <span>Mafia: Shadow Conflict</span>
      <span>Ne fais confiance à personne.</span>
    </footer>
  </div>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
