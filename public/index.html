<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06080f">
  <title>المستذئبون — Loup-Garou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 sm:px-6">
    <header class="flex items-center justify-between py-5">
      <a href="/" class="flex items-center gap-2 font-display text-xl font-bold text-slate-100">
        <span aria-hidden="true">🐺</span> المستذئبون
        <span class="text-xs font-normal text-slate-500" dir="ltr">Loup-Garou</span>
      </a>
      <span id="connection" class="chip bg-white/5 text-slate-400" role="status" aria-live="polite">
        جارٍ الاتصال…
      </span>
    </header>

    <main id="app" class="flex-1 pb-10"></main>

    <footer class="flex justify-between border-t border-white/5 py-5 text-xs text-slate-500">
      <span>المستذئبون — لعبة جماعية</span>
      <span>لا تثق بأحد.</span>
    </footer>
  </div>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
